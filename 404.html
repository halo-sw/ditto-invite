<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ditto! 초대장</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Pretendard Variable", Pretendard, -apple-system, sans-serif;
    background: linear-gradient(180deg, #aab6f0 0%, #cdd7f6 46%, #eef1fb 100%);
    display: flex; align-items: center; justify-content: center;
    padding: 24px; color: #1c1c22;
  }
  .card {
    width: 100%; max-width: 380px; background: rgba(255,255,255,.92);
    border-radius: 28px; padding: 44px 28px 36px; text-align: center;
    box-shadow: 0 18px 60px rgba(60,60,120,.18);
    backdrop-filter: blur(6px);
  }
  .wordmark { height: 30px; margin-bottom: 26px; }
  h1 { font-size: 19px; font-weight: 700; line-height: 1.45; margin-bottom: 6px; }
  .sub { font-size: 13.5px; font-weight: 500; color: #6b6b76; line-height: 1.55; }
  .code {
    margin: 26px 0 10px; font-size: 34px; font-weight: 800; letter-spacing: .18em;
    color: #7e37c2; background: #f4ecfb; border-radius: 16px; padding: 16px 8px 16px calc(8px + .18em);
    user-select: all;
  }
  .copy {
    display: inline-block; margin-bottom: 26px; font-size: 12.5px; font-weight: 600;
    color: #7e37c2; background: none; border: none; cursor: pointer; font-family: inherit;
  }
  .steps { text-align: left; font-size: 13.5px; font-weight: 500; color: #44444c; line-height: 2.0; }
  .steps b { font-weight: 700; }
  .foot { margin-top: 28px; font-size: 11.5px; font-weight: 500; color: #9a9aa4; line-height: 1.6; }
</style>
</head>
<body>
  <main class="card">
    <img class="wordmark" src="/wordmark.svg" alt="ditto!">
    <h1>친구가 ditto!에 초대했어요</h1>
    <p class="sub">위젯으로 서로의 하루를 주고받는 친구들의 공간</p>
    <div class="code" id="code">------</div>
    <button class="copy" id="copy">코드 복사하기</button>
    <div class="steps">
      <div>1&nbsp;&nbsp;ditto! 앱을 열어주세요</div>
      <div>2&nbsp;&nbsp;가입할 때 <b>초대코드</b>를 입력해주세요</div>
      <div>3&nbsp;&nbsp;친구의 플래터에서 다시 만나요</div>
    </div>
    <p class="foot">앱이 설치돼 있다면 이 링크가 앱에서 바로 열려요.<br>ditto!는 곧 App Store에서 만날 수 있어요.</p>
  </main>
<script>
  const seg = location.pathname.split('/').filter(Boolean)[0] || '';
  const code = /^[A-Za-z0-9]{6}$/.test(seg) ? seg.toUpperCase() : null;
  const codeEl = document.getElementById('code');
  const copyBtn = document.getElementById('copy');
  if (code) {
    codeEl.textContent = code;
  } else {
    codeEl.style.display = 'none';
    copyBtn.style.display = 'none';
  }
  copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(code);
      copyBtn.textContent = '복사됐어요!';
      setTimeout(() => copyBtn.textContent = '코드 복사하기', 1600);
    } catch {}
  });
</script>
</body>
</html>
